<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="theme-color" content="#060c18"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<title>MedTech AI</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#060c18;--bg2:#0a1628;--bg3:#0d2040;--cyan:#00d4ff;--green:#00e676;--orange:#ff9800;--red:#ff4444;--text:#e0f0ff;--text3:#3a6080;--border:#00d4ff22;--border2:#00d4ff44;}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',sans-serif;overflow:hidden;}
::-webkit-scrollbar{width:4px;}::-webkit-scrollbar-track{background:var(--bg2);}::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px;}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;}
.topbar{background:linear-gradient(135deg,#0a1628,#0d2040);border-bottom:1px solid var(--border);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;z-index:100;}
.logo{display:flex;align-items:center;gap:10px;}.logo-icon{font-size:26px;filter:drop-shadow(0 0 8px var(--cyan));}
.logo-title{font-size:17px;font-weight:700;color:var(--cyan);letter-spacing:1px;}.logo-sub{font-size:10px;color:var(--text3);}
.back-btn{background:var(--bg3);border:1px solid var(--border2);color:var(--cyan);padding:7px 14px;border-radius:8px;cursor:pointer;font-size:13px;font-family:inherit;display:flex;align-items:center;gap:6px;}
.view{display:none;flex:1;overflow:hidden;flex-direction:column;}.view.active{display:flex;}
#home{overflow-y:auto;}.home-inner{padding:20px 16px;max-width:700px;margin:0 auto;}
.home-header{text-align:center;margin-bottom:24px;padding-top:8px;}.home-title{font-size:22px;font-weight:700;margin-bottom:6px;}.home-sub{font-size:13px;color:var(--text3);}
.device-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;}
.device-card{border-radius:16px;padding:18px 14px;cursor:pointer;position:relative;overflow:hidden;border:1px solid transparent;transition:transform .15s;-webkit-tap-highlight-color:transparent;}
.device-card:active{transform:scale(0.97);}.dev-stripe{position:absolute;top:0;left:0;right:0;height:3px;border-radius:16px 16px 0 0;}
.dev-icon{font-size:30px;margin-bottom:10px;}.dev-name{font-size:15px;font-weight:600;color:#e8f4ff;margin-bottom:3px;}
.dev-model{font-size:11px;color:var(--text3);font-family:'JetBrains Mono',monospace;margin-bottom:8px;}.dev-status{font-size:11px;margin-bottom:12px;}
.dev-btn{padding:6px 10px;border-radius:8px;font-size:12px;font-weight:600;text-align:center;}
.add-card{border:2px dashed #00d4ff33;border-radius:16px;padding:18px 14px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:150px;background:#00d4ff08;-webkit-tap-highlight-color:transparent;}
.add-card:active{transform:scale(0.97);}.add-icon{font-size:38px;color:#00d4ff55;margin-bottom:8px;}.add-text{font-size:13px;color:#00d4ff77;font-weight:600;}.add-sub{font-size:11px;color:var(--text3);margin-top:4px;}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3);}.empty-icon{font-size:48px;margin-bottom:16px;}.empty-title{font-size:17px;color:#2a5a7b;margin-bottom:8px;}
#chat{flex-direction:column;}
.chat-header{background:var(--bg2);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;flex-wrap:wrap;}
.chat-dev-info{display:flex;align-items:center;gap:8px;flex:1;min-width:0;}.chat-dev-icon{font-size:22px;}
.chat-dev-name{font-size:14px;font-weight:700;color:var(--cyan);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.chat-dev-model{font-size:10px;color:var(--text3);font-family:'JetBrains Mono',monospace;}
.upload-manual-btn{background:var(--bg3);border:1px solid var(--border2);color:var(--cyan);padding:7px 12px;border-radius:8px;cursor:pointer;font-size:12px;font-family:inherit;white-space:nowrap;flex-shrink:0;}
.messages{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:14px;}
.msg-row{display:flex;align-items:flex-start;gap:8px;}.msg-row.user{flex-direction:row-reverse;}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;}
.avatar.ai{background:linear-gradient(135deg,#0a2540,#0d3060);border:1px solid var(--border2);}
.avatar.user{background:linear-gradient(135deg,#1a0a40,#2d1060);border:1px solid #a855f744;}
.bubble{border-radius:4px 16px 16px 16px;padding:11px 14px;max-width:82%;line-height:1.75;font-size:13.5px;color:#c8e0f8;word-break:break-word;}
.bubble.ai{background:linear-gradient(135deg,#0a1e38,#0d2545);border:1px solid var(--border);}
.bubble.user{background:linear-gradient(135deg,#15093a,#1e0d50);border:1px solid #a855f733;border-radius:16px 4px 16px 16px;text-align:right;}
.bubble strong{color:var(--cyan);font-weight:600;}.bubble code{background:#0a2540;padding:2px 6px;border-radius:4px;font-family:'JetBrains Mono',monospace;font-size:12px;color:#00e676;}
.bubble h3{color:var(--cyan);font-size:14px;margin:8px 0 4px;}.bubble hr{border:none;border-top:1px solid var(--border);margin:8px 0;}
.bubble ul{padding-right:18px;margin:6px 0;}.bubble li{margin-bottom:4px;}
.msg-img{max-width:100%;border-radius:8px;margin-bottom:8px;border:1px solid var(--border);}
.typing{display:flex;gap:4px;padding:4px 0;align-items:center;}
.dot{width:8px;height:8px;border-radius:50%;background:var(--cyan);display:inline-block;}
.dot:nth-child(1){animation:pulse 1.2s infinite;}.dot:nth-child(2){animation:pulse 1.2s .2s infinite;}.dot:nth-child(3){animation:pulse 1.2s .4s infinite;}
@keyframes pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.img-preview{margin:0 12px 8px;display:inline-flex;align-items:flex-start;gap:6px;background:var(--bg2);padding:6px;border-radius:10px;border:1px solid var(--border);}
.preview-img{max-height:70px;border-radius:6px;}
.remove-img{background:var(--red);border:none;color:#fff;border-radius:50%;width:20px;height:20px;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.input-bar{padding:10px 12px;background:var(--bg2);border-top:1px solid var(--border);display:flex;gap:8px;align-items:center;flex-shrink:0;padding-bottom:max(10px,env(safe-area-inset-bottom));}
.icon-btn{background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:9px 11px;cursor:pointer;font-size:17px;color:var(--cyan);flex-shrink:0;-webkit-tap-highlight-color:transparent;}
.text-input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:9px 12px;color:var(--text);font-size:14px;font-family:inherit;outline:none;height:42px;}
.text-input::placeholder{color:var(--text3);}
.send-btn{background:linear-gradient(135deg,#00a8d4,#0070a0);border:none;border-radius:10px;padding:9px 16px;color:#fff;font-size:17px;cursor:pointer;flex-shrink:0;transition:opacity .2s;}
.send-btn:disabled{opacity:.4;}
.modal-overlay{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;z-index:200;padding:20px;}
.modal{background:linear-gradient(135deg,#0a1628,#0d2040);border:1px solid var(--border2);border-radius:20px;padding:24px;width:100%;max-width:340px;}
.modal-title{font-size:17px;font-weight:700;color:var(--cyan);margin-bottom:18px;text-align:center;}
.modal-input{width:100%;background:#060c18;border:1px solid var(--border2);border-radius:10px;padding:11px 13px;color:var(--text);font-size:14px;font-family:inherit;outline:none;margin-bottom:10px;display:block;}
.modal-btns{display:flex;gap:10px;margin-top:6px;}
.cancel-btn{flex:1;background:var(--bg2);border:1px solid #ff444444;color:#ff6666;padding:10px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:14px;}
.confirm-btn{flex:1;background:linear-gradient(135deg,#00a8d4,#0070a0);border:none;color:#fff;padding:10px;border-radius:10px;cursor:pointer;font-family:inherit;font-size:14px;font-weight:600;}
.toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:#0d3060;border:1px solid var(--border2);color:var(--cyan);padding:10px 22px;border-radius:50px;font-size:13px;z-index:300;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;}
#loadingScreen{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;gap:16px;}
#loadingScreen .spin{font-size:48px;filter:drop-shadow(0 0 16px var(--cyan));animation:pulse 1.5s infinite;}
#loadingScreen p{color:var(--text3);font-size:14px;}
.c0{background:#0a2540;border-color:#00d4ff33;}.c0 .dev-stripe{background:#00d4ff;}.c0 .dev-btn{background:#00d4ff22;color:#00d4ff;}
.c1{background:#1a0a40;border-color:#a855f733;}.c1 .dev-stripe{background:#a855f7;}.c1 .dev-btn{background:#a855f722;color:#a855f7;}
.c2{background:#0a3020;border-color:#00e67633;}.c2 .dev-stripe{background:#00e676;}.c2 .dev-btn{background:#00e67622;color:#00e676;}
.c3{background:#402010;border-color:#ff980033;}.c3 .dev-stripe{background:#ff9800;}.c3 .dev-btn{background:#ff980022;color:#ff9800;}
.c4{background:#300a20;border-color:#ff408133;}.c4 .dev-stripe{background:#ff4081;}.c4 .dev-btn{background:#ff408122;color:#ff4081;}
.status-ok{color:var(--green);}.status-warn{color:var(--orange);}
</style>
</head>
<body>
<div id="loadingScreen"><span class="spin">⚕</span><p>جارٍ التحميل...</p></div>
<div id="app" style="display:none">
  <div class="topbar">
    <div class="logo"><span class="logo-icon">⚕</span><div><div class="logo-title">MedTech AI</div><div class="logo-sub">مساعد الصيانة الذكي</div></div></div>
    <button class="back-btn" id="backBtn" style="display:none" onclick="goHome()">&#x2190; الأجهزة</button>
  </div>
  <div id="home" class="view active">
    <div class="home-inner">
      <div class="home-header"><div class="home-title">أجهزتك المسجلة</div><div class="home-sub">اختر جهازاً للبدء في التشخيص والصيانة</div></div>
      <div class="device-grid" id="deviceGrid">
        <div class="add-card" onclick="openAddDevice()"><div class="add-icon">+</div><div class="add-text">إضافة جهاز جديد</div><div class="add-sub">Add New Device</div></div>
      </div>
      <div class="empty-state" id="emptyState"><div class="empty-icon">🔧</div><div class="empty-title">لا توجد أجهزة مسجلة بعد</div><div style="font-size:13px">اضغط على "+" لإضافة جهازك الأول</div></div>
    </div>
  </div>
  <div id="chat" class="view">
    <div class="chat-header">
      <div class="chat-dev-info"><span class="chat-dev-icon">🏥</span><div><div class="chat-dev-name" id="chatDevName">—</div><div class="chat-dev-model" id="chatDevModel">—</div></div></div>
      <button class="upload-manual-btn" onclick="document.getElementById('manualInput').click()">📄 <span id="manualBtnText">رفع المانيوال</span></button>
      <input type="file" id="manualInput" accept=".pdf,.txt" style="display:none" onchange="handleManualUpload(this.files[0])"/>
    </div>
    <div class="messages" id="messages"></div>
    <div id="imgPreviewBar" style="display:none" class="img-preview">
      <img id="previewImg" class="preview-img" src="" alt=""/>
      <button class="remove-img" onclick="removeImage()">x</button>
    </div>
    <div class="input-bar">
      <button class="icon-btn" onclick="document.getElementById('imageInput').click()">📷</button>
      <input type="file" id="imageInput" accept="image/*" style="display:none" onchange="handleImageSelect(this.files[0])"/>
      <input class="text-input" id="msgInput" placeholder="أدخل رقم الخطأ أو وصف المشكلة..." dir="auto" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage();}"/>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">&#x27A4;</button>
    </div>
  </div>
</div>
<div class="modal-overlay" id="addModal" style="display:none" onclick="if(event.target.id==='addModal')closeAddModal()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-title">إضافة جهاز جديد<br/><small style="font-size:12px;color:var(--text3)">Add New Device</small></div>
    <input class="modal-input" id="newDevName" placeholder="اسم الجهاز (Device Name) *" dir="auto"/>
    <input class="modal-input" id="newDevModel" placeholder="رقم الموديل (Model Number)" dir="ltr"/>
    <div class="modal-btns"><button class="cancel-btn" onclick="closeAddModal()">إلغاء</button><button class="confirm-btn" onclick="addDevice()">إضافة</button></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const GEMINI_API_KEY = 'AIzaSyCCp-9V4A7LUNxT1HJQSUts-cdWlEvei20';
const GEMINI_URL = 'https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=' + GEMINI_API_KEY;

const SYSTEM_PROMPT = `You are MedTech AI, an expert bilingual (Arabic/English) assistant for medical and industrial device maintenance engineers.
When given an error code or device problem:
1. Start with a brief Arabic summary of the issue
2. Explain what caused the error
3. Give numbered bilingual troubleshooting steps (Arabic then English for each step)
4. List parts that may need replacement with part numbers if available
5. Mention required tools and safety warnings
6. If service manual content is provided, reference it directly
Format with clear sections using **bold headers**. Be precise and technical. Always prioritize patient safety.`;

// IndexedDB
let db=null;
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open('MedTechAI_v2',1);r.onupgradeneeded=e=>{const d=e.target.result;if(!d.objectStoreNames.contains('manuals'))d.createObjectStore('manuals',{keyPath:'deviceId'});};r.onsuccess=e=>{db=e.target.result;res();};r.onerror=e=>rej(e.target.error);});}
function dbSave(id,data){return new Promise((res,rej)=>{const tx=db.transaction('manuals','readwrite');tx.objectStore('manuals').put({deviceId:id,...data});tx.oncomplete=res;tx.onerror=e=>rej(e.target.error);});}
function dbGet(id){return new Promise((res,rej)=>{const tx=db.transaction('manuals','readonly');const r=tx.objectStore('manuals').get(id);r.onsuccess=e=>res(e.target.result||null);r.onerror=e=>rej(e.target.error);});}

let devices=[],selectedDevice=null,history=[],pendingImg=null,loading=false;
function saveDevices(){localStorage.setItem('mtd_v2',JSON.stringify(devices));}
function loadDevices(){devices=JSON.parse(localStorage.getItem('mtd_v2')||'[]');}

function toast(msg,ms=2500){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),ms);}

function renderDevices(){
  const grid=document.getElementById('deviceGrid'),empty=document.getElementById('emptyState');
  grid.querySelectorAll('.device-card').forEach(c=>c.remove());
  empty.style.display=devices.length===0?'block':'none';
  const add=grid.querySelector('.add-card');
  devices.forEach(d=>{
    const c=document.createElement('div');c.className=`device-card c${d.colorIdx}`;
    c.innerHTML=`<div class="dev-stripe"></div><div class="dev-icon">🏥</div><div class="dev-name">${esc(d.name)}</div><div class="dev-model">${esc(d.model||'—')}</div><div class="dev-status ${d.hasManual?'status-ok':'status-warn'}">${d.hasManual?'✅ '+esc(d.manualName):'⚠️ No manual'}</div><div class="dev-btn">فتح المساعد</div>`;
    c.onclick=()=>selectDevice(d);grid.insertBefore(c,add);
  });
}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function selectDevice(dev){
  selectedDevice=dev;history=[];
  document.getElementById('chatDevName').textContent=dev.name;
  document.getElementById('chatDevModel').textContent=dev.model||'';
  document.getElementById('manualBtnText').textContent=dev.hasManual?'تحديث المانيوال':'رفع المانيوال';
  document.getElementById('messages').innerHTML='';
  removeImage();
  const stored=await dbGet(dev.id);
  const msg=stored
    ?`👋 **مرحباً! مساعدك الذكي لصيانة ${dev.name}**\n\n✅ **السيرفس مانيوال محفوظ بشكل دائم:** "${dev.manualName}"\n💾 لن تحتاج لرفعه مجدداً\n\nأرسل لي رقم الخطأ أو صورة الشاشة.`
    :`👋 **مرحباً! مساعدك الذكي لصيانة ${dev.name}**\n\n⚠️ لا يوجد سيرفس مانيوال بعد.\nاضغط 📄 لرفعه — سيُحفظ بشكل دائم.`;
  addMsg('assistant',msg);
  showView('chat');
}

function showView(v){document.getElementById('home').classList.toggle('active',v==='home');document.getElementById('chat').classList.toggle('active',v==='chat');document.getElementById('backBtn').style.display=v==='chat'?'flex':'none';}
function goHome(){showView('home');selectedDevice=null;}
function openAddDevice(){document.getElementById('addModal').style.display='flex';setTimeout(()=>document.getElementById('newDevName').focus(),80);}
function closeAddModal(){document.getElementById('addModal').style.display='none';}
function addDevice(){
  const el=document.getElementById('newDevName'),name=el.value.trim();
  if(!name){el.style.borderColor='red';return;}el.style.borderColor='';
  const model=document.getElementById('newDevModel').value.trim();
  devices.push({id:Date.now().toString(),name,model,hasManual:false,manualName:'',colorIdx:devices.length%5});
  saveDevices();renderDevices();closeAddModal();
  document.getElementById('newDevName').value='';document.getElementById('newDevModel').value='';
  toast('✅ تمت إضافة الجهاز');
}

async function handleManualUpload(file){
  if(!file||!selectedDevice)return;
  addMsg('assistant',`⏳ جارٍ الحفظ الدائم... "${file.name}"`);
  try{
    let record;
    if(file.type==='application/pdf'){const b=await toB64(file);record={type:'pdf',base64:b,name:file.name,mediaType:'application/pdf'};}
    else{const t=await toText(file);record={type:'text',content:t.substring(0,20000),name:file.name};}
    await dbSave(selectedDevice.id,record);
    selectedDevice.hasManual=true;selectedDevice.manualName=file.name;
    devices=devices.map(d=>d.id===selectedDevice.id?{...d,hasManual:true,manualName:file.name}:d);
    saveDevices();renderDevices();
    document.getElementById('manualBtnText').textContent='تحديث المانيوال';
    const msgs=document.getElementById('messages');if(msgs.lastElementChild)msgs.removeChild(msgs.lastElementChild);
    addMsg('assistant',`✅ **تم الحفظ الدائم!**\n\n📄 **"${file.name}"**\n💾 محفوظ على جهازك نهائياً\n\nالآن أرسل رقم الخطأ أو صورة الشاشة.`);
    toast('💾 محفوظ بشكل دائم');
  }catch(e){addMsg('assistant','❌ خطأ في الحفظ. حاول مرة أخرى.');}
  document.getElementById('manualInput').value='';
}

async function handleImageSelect(file){
  if(!file)return;
  const b=await toB64(file);const url=URL.createObjectURL(file);
  pendingImg={base64:b,mediaType:file.type,url};
  document.getElementById('previewImg').src=url;document.getElementById('imgPreviewBar').style.display='flex';
  document.getElementById('imageInput').value='';
}
function removeImage(){pendingImg=null;document.getElementById('imgPreviewBar').style.display='none';document.getElementById('previewImg').src='';}

async function sendMessage(){
  const inp=document.getElementById('msgInput'),text=inp.value.trim();
  if(!text&&!pendingImg)return;if(loading||!selectedDevice)return;
  const userText=text||'📷 صورة الخطأ';const img=pendingImg;
  inp.value='';removeImage();
  addMsg('user',userText,img?.url);
  history.push({role:'user',parts:[{text:userText}]});
  setLoading(true);
  try{
    const manual=await dbGet(selectedDevice.id);
    let systemText=SYSTEM_PROMPT+`\nCurrent device: ${selectedDevice.name} ${selectedDevice.model||''}`;
    if(manual&&manual.type==='text'){systemText+=`\n\nSERVICE MANUAL:\n${manual.content}`;}

    // Build contents for Gemini
    const contents=[];
    // Add history except last
    history.slice(0,-1).forEach(h=>contents.push(h));

    // Build current user part
    const parts=[];
    if(img){parts.push({inline_data:{mime_type:img.mediaType,data:img.base64}});}
    parts.push({text:text||'What error is shown? Provide full bilingual troubleshooting.'});

    // For PDF manual, add as text note
    if(manual&&manual.type==='pdf'){
      parts.unshift({text:`[Service manual PDF is attached for ${selectedDevice.name}]`});
    }

    contents.push({role:'user',parts});

    const body={
      system_instruction:{parts:[{text:systemText}]},
      contents,
      generationConfig:{maxOutputTokens:1500,temperature:0.3}
    };

    const res=await fetch(GEMINI_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const data=await res.json();
    if(data.error)throw new Error(data.error.message);
    const reply=data.candidates?.[0]?.content?.parts?.[0]?.text||'لم يتم الحصول على رد.';
    history.push({role:'model',parts:[{text:reply}]});
    addMsg('assistant',reply);
  }catch(e){addMsg('assistant',`❌ خطأ: ${e.message}`);}
  setLoading(false);
}

function setLoading(v){
  loading=v;document.getElementById('sendBtn').disabled=v;
  const msgs=document.getElementById('messages'),ex=document.getElementById('typin');
  if(v&&!ex){const r=document.createElement('div');r.className='msg-row';r.id='typin';r.innerHTML='<div class="avatar ai">🤖</div><div class="bubble ai"><div class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div></div>';msgs.appendChild(r);msgs.scrollTop=msgs.scrollHeight;}
  else if(!v&&ex)ex.remove();
}

function addMsg(role,text,imgUrl){
  const msgs=document.getElementById('messages'),row=document.createElement('div');row.className=`msg-row ${role}`;
  const av=document.createElement('div');av.className=`avatar ${role}`;av.textContent=role==='user'?'👷':'🤖';
  const bub=document.createElement('div');bub.className=`bubble ${role}`;
  if(imgUrl){const i=document.createElement('img');i.src=imgUrl;i.className='msg-img';bub.appendChild(i);}
  const td=document.createElement('div');td.innerHTML=fmt(text);bub.appendChild(td);
  row.appendChild(av);row.appendChild(bub);msgs.appendChild(row);msgs.scrollTop=msgs.scrollHeight;
}
function fmt(t){return t.replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>').replace(/\*(.*?)\*/g,'<em>$1</em>').replace(/`([^`]+)`/g,'<code>$1</code>').replace(/^#{1,3}\s(.+)$/gm,'<h3>$1</h3>').replace(/^---$/gm,'<hr/>').replace(/\n/g,'<br/>');}
function toB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f);});}
function toText(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(f);});}

openDB().catch(()=>{}).finally(()=>{loadDevices();renderDevices();document.getElementById('loadingScreen').style.display='none';document.getElementById('app').style.display='flex';});
</script>
</body>
</html>
